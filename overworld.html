<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;

body{background:#0a0010;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;overflow:hidden;font-family:monospace;}
#gw{display:flex;flex-direction:column;align-items:center;width:100%;max-width:480px;height:100dvh;background:#08000e;}
#topbar{width:100%;background:#0d0018;border-bottom:2px solid #4a1a6a;padding:4px 8px;display:flex;align-items:center;gap:6px;flex-shrink:0;}
.hb{display:flex;flex-direction:column;gap:1px;flex:1;}
.hbl{color:#999;font-size:8px;letter-spacing:1px;}
.hbbar{height:8px;background:#1a0028;border-radius:3px;overflow:hidden;border:1px solid #3a1a5a;}
.hbfill{height:100%;border-radius:2px;transition:width 0.15s;}
.gold{color:#e8c060;font-size:10px;background:#140020;border:1px solid #4a2a6a;border-radius:4px;padding:2px 5px;white-space:nowrap;}
#sf{width:100%;flex:1;position:relative;overflow:hidden;}
#gc{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#06000f;}
#notif{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:rgba(0,0,20,0.95);border:1px solid #e8c060;border-radius:6px;padding:4px 12px;color:#e8c060;font-size:11px;pointer-events:none;opacity:0;transition:opacity 0.3s;white-space:nowrap;z-index:10;}
#notif.show{opacity:1;}
#lb{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);background:rgba(0,0,20,0.9);border:1px solid #8040ff;border-radius:5px;padding:3px 12px;color:#d0a0ff;font-size:10px;pointer-events:none;opacity:0;transition:opacity 0.4s;white-space:nowrap;}
#lb.show{opacity:1;}
#dlg{position:absolute;bottom:6px;left:6px;right:6px;background:rgba(5,0,25,0.97);border:2px solid #7030c0;border-radius:8px;padding:10px 12px;display:none;z-index:20;}
#dlgname{color:#e8c060;font-size:12px;font-weight:bold;margin-bottom:5px;}
#dlgtext{color:#e0d0ff;font-size:11px;line-height:1.5;}
#dlghint{color:#6030a0;font-size:9px;margin-top:6px;}
#questlog{position:absolute;top:6px;left:6px;background:rgba(5,0,25,0.92);border:1px solid #5020a0;border-radius:6px;padding:6px 8px;font-size:9px;color:#c0a0ff;max-width:160px;pointer-events:none;}
#questlog .qt{color:#e8c060;font-weight:bold;margin-bottom:3px;}
#ctrl{width:100%;background:#09000f;border-top:2px solid #3a1060;padding:8px 10px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:6px;}
#dp{position:relative;width:114px;height:114px;flex-shrink:0;}
.db{position:absolute;width:36px;height:36px;background:#110018;border:2px solid #5a2a8a;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#b070f0;font-size:15px;user-select:none;box-shadow:0 3px 0 #06000a;}
.db.pr{background:#260045!important;transform:translateY(2px)!important;box-shadow:none!important;}
#bu{top:0;left:50%;transform:translateX(-50%);}
#bd{bottom:0;left:50%;transform:translateX(-50%);}
#bl{left:0;top:50%;transform:translateY(-50%);}
#br{right:0;top:50%;transform:translateY(-50%);}
.dc{position:absolute;width:22px;height:22px;background:#09000f;border:2px solid #2a1040;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);}

#m1btn .mico{font-size:20px;line-height:1;}
#skrow{display:flex;gap:4px;}

<script>

let dragonSprLoaded=false;
const DRAGON_FRAME=96;
const DRAGON_DIR_ROW={down:0,up:1,left:2,right:3};

// ── DRAGON ENTITY ─────────────────────────────────────────────
const dragons=[];
function spawnDragon(){
  // Spawn 3 free Time Dragons spread across the dimension
  const spawnPoints=[
    {x:10*TILE,y:10*TILE},  // calm zone
    {x:45*TILE,y:10*TILE},  // calm zone NE
    {x:28*TILE,y:45*TILE},  // fractured zone
  ];
  for(let i=0;i<3;i++){
    const sp=spawnPoints[i];
    dragons.push({
      id:i,
      x:sp.x,y:sp.y,
      get cx(){return this.x+TILE;},
      get cy(){return this.y+TILE;},
      dir:'down',fr:0,ft:0,
      // Flight state
      flying:true,
      flyTimer:3000+Math.random()*4000,  // time until land/takeoff
      flyHeight:1+Math.random()*0.5,     // visual height offset multiplier
      bobTimer:Math.random()*Math.PI*2,
      // Movement
      moveDir:{x:(Math.random()-0.5)*2,y:(Math.random()-0.5)*2},
      moveTimer:2000+Math.random()*3000,
      sp:0.8+Math.random()*0.4,
      // Turn timer — changes direction
      turnTimer:1500+Math.random()*2000,
      name:'Dragão do Tempo',
      sz:48,
      shadow:true,
    });
  }
}

function updateDragons(dt){
  for(const d of dragons){
    d.bobTimer+=dt*0.003;
    d.ft+=dt/16.67;
    if(d.ft>10){d.ft=0;d.fr=(d.fr+1)%3;}

    // Flight/land toggle
    d.flyTimer-=dt;
    if(d.flyTimer<=0){
      d.flying=!d.flying;
      d.flyTimer=d.flying?(3000+Math.random()*5000):(1500+Math.random()*2500);
      if(d.flying)d.flyHeight=0.8+Math.random()*0.6;
    }

    // Direction change
    d.turnTimer-=dt;
    if(d.turnTimer<=0){
      d.turnTimer=1200+Math.random()*2500;
      const a=Math.random()*Math.PI*2;
      d.moveDir={x:Math.cos(a),y:Math.sin(a)};
      d.moveTimer=1500+Math.random()*3000;
    }

    // Movement — only when flying or moveTimer active
    if(d.flying||d.moveTimer>0){
      d.moveTimer-=dt;
      const spd=(d.flying?d.sp*1.3:d.sp*0.5)*dt/16.67;
      const nx=d.x+d.moveDir.x*spd;
      const ny=d.y+d.moveDir.y*spd;

      // Boundary check — keep in dimension
      if(nx>TILE&&nx<(MW-2)*TILE)d.x=nx;
      else{d.moveDir.x*=-1;}
      if(ny>TILE&&ny<(MH-2)*TILE)d.y=ny;
      else{d.moveDir.y*=-1;}

      // Update direction
      if(Math.abs(d.moveDir.x)>Math.abs(d.moveDir.y))
        d.dir=d.moveDir.x>0?'right':'left';
      else d.dir=d.moveDir.y>0?'down':'up';
    }
  }
}

function drawDragons(){
  if(!dragonSprLoaded)return;
  const img=document.getElementById('dragonImg');
  for(const d of dragons){
    const sx=d.cx-camX;
    const sy=d.cy-camY;
    if(sx<-120||sx>canvas.width+120||sy<-120||sy>canvas.height+120)continue;

    const bob=d.flying?Math.sin(d.bobTimer)*6*d.flyHeight:0;
    const heightOffset=d.flying?-TILE*d.flyHeight*0.8:0;
    const drawY=sy+heightOffset+bob;
    const drawSize=TILE*2.2; // bigger than player (player is ~46px, this is ~105px)

    ctx.save();

    // Shadow on ground when flying
    if(d.flying){
      const shadowAlpha=Math.max(0,0.35-d.flyHeight*0.15);
      ctx.fillStyle=`rgba(0,0,0,${shadowAlpha})`;
      ctx.beginPath();
      ctx.ellipse(sx,sy+TILE*0.3,drawSize*0.4,drawSize*0.12,0,0,Math.PI*2);
      ctx.fill();
    }

    // Dragon sprite
    const row=DRAGON_DIR_ROW[d.dir]??0;
    const fr=d.fr%3;
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(img,
      fr*DRAGON_FRAME,row*DRAGON_FRAME,DRAGON_FRAME,DRAGON_FRAME,
      sx-drawSize/2, drawY-drawSize/2, drawSize, drawSize
    );

    // Name above dragon
    ctx.globalAlpha=0.8;
    ctx.fillStyle='#60a0ff';
    ctx.font='bold 8px monospace';
    ctx.textAlign='center';
    ctx.fillText(d.name,sx,drawY-drawSize/2-5);

    ctx.restore();
  }
}

const AC=new (window.AudioContext||window.webkitAudioContext)();
function beep(freq,type,dur,vol,delay=0){
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,AC.currentTime+delay);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+delay+dur);
  o.start(AC.currentTime+delay);o.stop(AC.currentTime+delay+dur+0.05);
}

let activeQuests=['q1','q3','q4'];

function questProgress(type,target){
  for(const qid of activeQuests){
    const q=quests.find(x=>x.id===qid);if(!q||q.done)continue;
    const g=q.goal;if(g.type!==type)continue;
    if(type==='kill'&&(target===g.target||g.target==='evil'))q.progress++;
    else if(type==='talk'&&target===g.target)q.progress=1;
    else if(type==='chest')q.progress++;
    else if(type==='zone'&&target===g.target)q.progress=1;
    if(q.progress>=g.count){
      q.done=true;playerGold+=q.reward.gold||0;
      if(q.reward.hp){pl.maxHp+=q.reward.hp;pl.hp=Math.min(pl.maxHp,pl.hp+q.reward.hp);}
      showNotif(q.reward.msg,'#60ff80');sndGold();
      if(qid==='q1')activeQuests.push('q2');
      if(qid==='q2')activeQuests.push('q5');
      if(qid==='q3')activeQuests.push('q6');
      if(qid==='q6')activeQuests.push('q7');
      updateHUD();updateQuestLog();
    }
  }
  updateQuestLog();
}
function updateQuestLog(){
  document.getElementById('qlist').innerHTML=activeQuests.map(qid=>{
    const q=quests.find(x=>x.id===qid);if(!q)return'';
    return q.done?`<span style="color:#60ff60">✓ ${q.name}</span>`:`<span style="color:#c0a0ff">${q.name}: ${q.progress}/${q.goal.count||1}</span>`;
  }).join('<br>')||'—';
}

function rnd(n){return Math.floor(Math.random()*n);}
function dst(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy);}
function nearestEnemy(x,y,range,goodOnly,ignoreSpirit){
  let best=null,bd=range??Infinity;
  for(const m of monsters){
    if(goodOnly!==undefined&&m.isGood!==goodOnly)continue;
    if(ignoreSpirit&&m.isSpirit)continue;
    const d=dst(m.cx,m.cy,x,y);if(d<bd){bd=d;best=m;}
  }
  return best;
}

function getZone(tx,ty){
  if(ty>=37&&ty<=47)return'lava';
  if(ty>=48&&ty<=55)return'ice';
  if(ty>=28&&ty<=36)return'lower';

}

function spawnMonster(){
  if(monsters.length>=10)return;
  const isBoss=Math.random()<0.07&&monsters.every(m=>!m.isBoss);
  const isGood=!isBoss&&Math.random()<0.25;
  
  // Pick zone to spawn in
  const zones=['calm','calm','unstable','unstable','fractured'];
  const spawnZone=zones[rnd(zones.length)];
  
  let pool=MBASE.filter(m=>m.isBoss===!!isBoss&&m.isGood===isGood);
  pool=MBASE.filter(m=>!m.isBoss&&!m.isGood&&!m.isSpirit);
  if(!pool.length)return;
  
  const tmpl=pool[rnd(pool.length)];
  let tx,ty,att=0;
  const zoneRanges={calm:[2,14],unstable:[17,28],fractured:[31,40],correction:[43,49]};
  const [yMin,yMax]=zoneRanges[spawnZone]||[2,19];
  do{

  }while(att<80&&(BLK.has(tiles[ty]?.[tx])||dst(tx*TILE,ty*TILE,pl.x,pl.y)<TILE*7));

function doDmg(m,dmg,col,attacker){
  m.hp=Math.max(0,m.hp-Math.floor(dmg));m.hitFlash=200;
  spawnNum(m.cx-camX,m.cy-camY-10,`-${Math.floor(dmg)}`,col||'#ff4040');
  if(m.isSpirit)m.spiritState='fleeing';
  if(attacker==='anubis')m.threatTarget='anubis';
  else if(attacker==='player')m.threatTarget='player';
  // Unstable Zone aggro chain — alert nearby spirits
  const mTY=Math.floor(m.cy/TILE);
  if(mTY>=17&&mTY<=28&&attacker==='player'){
    let alerted=0;
    for(const other of monsters){
      if(other.id===m.id||!other.isSpirit||alerted>=2)continue;
      if(dst(m.cx,m.cy,other.cx,other.cy)<TILE*5){
        other.spiritState='reactive';
        other.threatTarget='player';
        alerted++;
        spawnFX(other.cx,other.cy,'ring','#c080ff',TILE);
      }
    }
    if(alerted>0)spawnNum(m.cx-camX,m.cy-camY-35,'⚡ Alerta!','#c080ff');
  }
  if(m.hp<=0)killMonster(m);
}

function doM1(){
  if(pl.atkCd>0)return;
  pl.atkCd=pl.atkInterval;pl.atkAnim=280;
  const dv={right:[1,0],left:[-1,0],up:[0,-1],down:[0,1]}[pl.dir];
  pl.atkAnimDir={x:dv[0],y:dv[1]};
  const ang=Math.atan2(dv[1],dv[0]);
  let hit=false;
  for(const m of monsters){
    if(m.isGood)continue;
    const d=dst(m.cx,m.cy,pl.cx,pl.cy);
    if(d<pl.atkRange){
      let diff=Math.abs(Math.atan2(m.cy-pl.cy,m.cx-pl.cx)-ang);
      if(diff>Math.PI)diff=Math.PI*2-diff;
      if(diff<Math.PI*0.65){
        doDmg(m,pl.atkDmg+rnd(30),'#e8d0ff');
        const dd=dst(m.cx,m.cy,pl.cx,pl.cy)||1;m.kx=(m.cx-pl.cx)/dd*5;m.ky=(m.cy-pl.cy)/dd*5;
        spawnFX(m.cx,m.cy,'ring','#e8d0ff',TILE*1.2);hit=true;
      }
    }
  }
  sndAtk();
}

// ── ANUBIS AI ─────────────────────────────────────────────────
function updateAnubis(dt){
  if(an.dead){
    an.reviveTimer-=dt;
    if(an.reviveTimer<=0){an.dead=false;an.hp=an.maxHp;an.x=pl.x+TILE;an.y=pl.y;updateHUD();showNotif('Anúbis ressurgiu!','#60c0ff');}
    return;
  }
  an.atkCd=Math.max(0,an.atkCd-dt);an.dialogCd=Math.max(0,an.dialogCd-dt);
  for(const sk of an.skills)sk.t=Math.max(0,sk.t-dt);
  if(Math.abs(an.kx)>0.1){an.x+=an.kx;an.kx*=0.78;}
  if(Math.abs(an.ky)>0.1){an.y+=an.ky;an.ky*=0.78;}

  // Target: only notice enemies that are VERY close (natural encounter)
  if(an.forceTarget&&an.forceTarget.hp>0)an.target=an.forceTarget;
  else{an.target=nearestEnemy(an.cx,an.cy,TILE*4.5,false,true);an.forceTarget=null;}

  if(an.target&&an.target.hp>0){
    // Fight — no spinning, just face and attack
    const dx=an.target.cx-an.cx,dy=an.target.cy-an.cy;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    // Set direction based on dominant axis only
    if(Math.abs(dx)>Math.abs(dy))an.dir=dx>0?'right':'left';
    else an.dir=dy>0?'down':'up';
    // Handle active dash (runs regardless of distance)
    if(an.dashState){
      const ds=an.dashState;
      const ddx=ds.tx-an.cx,ddy=ds.ty-an.cy,ddd=Math.sqrt(ddx*ddx+ddy*ddy)||1;
      const step=ds.speed*dt/16.67;
      if(ddd<=step+4){
        an.x=ds.tx-TILE/2;an.y=ds.ty-TILE/2;
        an.dashState=null;
        ds.onArrive();
      }else{
        an.x+=ddx/ddd*step;an.y+=ddy/ddd*step;
        an.mv=true;
        if(Math.abs(ddx)>Math.abs(ddy))an.dir=ddx>0?'right':'left';
        else an.dir=ddy>0?'down':'up';
        if(Math.random()<0.4)spawnFX(an.cx,an.cy,'ring','#4090ff',10);
      }
    }else if(d>an.atkRange*0.8){
      const s=an.sp*dt/16.67;
      if(canGo(an.x+dx/d*s,an.y))an.x+=dx/d*s;
      if(canGo(an.x,an.y+dy/d*s))an.y+=dy/d*s;
      an.mv=true;
    }else{
      an.mv=false;an.fr=1;
      if(an.atkCd<=0){an.atkCd=an.atkInterval;doDmg(an.target,an.atkDmg+rnd(25),'#4090ff','anubis');spawnFX(an.target.cx,an.target.cy,'ring','#4090ff',TILE*1.4);}
    }
    // Energy regen always
    an.energy=Math.min(an.maxEnergy,(an.energy||0)+dt*0.008);
    // Skill check — runs regardless of distance (dash handles far targets)
    for(const sk of an.skills){
      if(sk.t>0||d>sk.range*4)continue;
      if(sk.isVerdict&&an.energy<35)continue;
      sk.t=sk.cd;
      if(sk.isVerdict){
        an.energy-=35;
        const executeVerdict=()=>{
          if(!an.target||an.target.hp<=0)return;
          const dmg=sk.dmg+rnd(20);
          doDmg(an.target,dmg,'#c0d0ff','anubis');
          an.target.frozen=Math.max(an.target.frozen||0,200+rnd(200));
          spawnFX(an.target.cx,an.target.cy,'burst','#c0d0ff');
          spawnVerdictSlash(an.cx,an.cy,an.target.cx,an.target.cy);
          spawnNum(an.target.cx-camX,an.target.cy-camY-40,'⚖️ Corte do Veredito','#c8d8ff');
          anSkillAnim={frame:0,timer:0,dir:an.dir};
          sndSkill3();
        };
        if(d>sk.range){
          // Far — dash 5 tiles toward target then execute
          const tdx=an.target.cx-an.cx,tdy=an.target.cy-an.cy,tdd=Math.sqrt(tdx*tdx+tdy*tdy)||1;
          const actualDist=Math.min(TILE*5,tdd-sk.range*0.8);
          const stopX=an.cx+tdx/tdd*actualDist;
          const stopY=an.cy+tdy/tdd*actualDist;
          an.dashState={tx:stopX,ty:stopY,speed:TILE*0.7,onArrive:executeVerdict};
        }else{
          executeVerdict();
        }
      }
    }
  } else {
    // Patrol calmly
    an.target=null;
    if(an.pausing){
      an.pauseMs-=dt;an.mv=false;an.fr=1;
      if(an.pauseMs<=0)an.pausing=false;
      if(an.dialogCd<=0&&Math.random()<0.001){an.dialogCd=16000;showNotif(`Anúbis: "${an.dialogs[an.dialogIdx++%an.dialogs.length]}"`,'#60c0ff');}
    }else{
      const pp=an.patrol[an.pidx];
      const dx=pp.x-an.x,dy=pp.y-an.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      if(d<TILE*1.5){
        an.pidx=(an.pidx+1)%an.patrol.length;
        an.pausing=true;an.pauseMs=800+Math.random()*2500;an.mv=false;an.fr=1;
      }else{
        const s=an.sp*dt/16.67;
        const mx=canGo(an.x+dx/d*s,an.y),my=canGo(an.x,an.y+dy/d*s);
        if(mx)an.x+=dx/d*s;if(my)an.y+=dy/d*s;
        // Set direction based on dominant axis only
        if(Math.abs(dx)>Math.abs(dy))an.dir=dx>0?'right':'left';
        else an.dir=dy>0?'down':'up';
        if(!mx&&!my){an.pidx=(an.pidx+1)%an.patrol.length;an.pausing=true;an.pauseMs=200;}
        an.mv=mx||my;
        if(an.mv)sndWalk();
      }
    }
  }

  an.regenTimer=(an.regenTimer||0)+dt;
  if(an.regenTimer>5000){an.regenTimer=0;if(an.hp<an.maxHp){an.hp=Math.min(an.maxHp,an.hp+10);updateHUD();}}
  if(an.mv){an.ft+=dt/16.67;if(an.ft>8){an.ft=0;an.fr=(an.fr+1)%3;}}else an.fr=1;
}


// ── SPIRIT AI ─────────────────────────────────────────────────
function applyZoneEffectsToMonster(m, dt){
  const tx=Math.floor(m.cx/TILE), ty=Math.floor(m.cy/TILE);

  // Calm Zone — slow field slows spirits too
  if(inZone(tx,ty,'calm')&&isSlowField(tx,ty)){
    m.sp=Math.max(m.sp*0.997, (m.sp||0.45)*0.6); // gradually slow
  }

  // Unstable Zone — hesitation tiles also freeze spirits briefly
  if(isHesitationTile(tx,ty)){
    if(!m.hesitFrozen&&Math.random()<0.008){
      m.frozen=Math.max(m.frozen,300);
      m.hesitFrozen=true;
      setTimeout(()=>{m.hesitFrozen=false;},1500);
    }
  }

  // Fractured Zone — fissures damage spirits too
  if(inZone(tx,ty,'fractured')){
    if(tiles[ty]?.[tx]===T.LAVA){
      m.hp=Math.max(1,m.hp-5*dt/1000*60);
      if(m.hp<=1)killMonster(m);
    }
    // Glitch — random direction change
    if(Math.random()<0.002){
      if(m.isSpirit)m.moveDir={x:(Math.random()-0.5)*2,y:(Math.random()-0.5)*2};
    }
  }

  // Correction Zone — spirits move slower and take passive damage
  if(inZone(tx,ty,'correction')){
    m.frozen=Math.max(m.frozen, Math.random()<0.005?400:0);
    m.hp=Math.max(1,m.hp-2*dt/1000*60);
    if(m.hp<=1)killMonster(m);
  }

  // Throne Zone — spirits instantly flee (Anubis territory)
  if(inZone(tx,ty,'throne')&&m.isSpirit){
    m.spiritState='fleeing';
  }
}

function updateSpiritAI(m,dt){
  m.aiTimer+=dt;m.meleeCd=Math.max(0,m.meleeCd-dt);m.hitFlash=Math.max(0,m.hitFlash-dt);
  m.frozen=Math.max(0,m.frozen-dt);
  applyZoneEffectsToMonster(m,dt);
  if(m.frozen>0){m.mv=false;return;}
  if(Math.abs(m.kx)>0.1){m.x+=m.kx;m.kx*=0.76;}
  if(Math.abs(m.ky)>0.1){m.y+=m.ky;m.ky*=0.76;}
  m.glitchTimer=(m.glitchTimer||0)-dt;
  if(m.glitchTimer<=0){m.glitchTimer=600+Math.random()*1400;m.glitchX=(Math.random()-0.5)*2;m.glitchY=(Math.random()-0.5)*2;}
  const dp=dst(m.cx,m.cy,pl.cx,pl.cy);
  // Fade when fleeing and low HP
  if(m.spiritState==='fleeing'&&m.hp<m.maxHp*0.3){
    m.fadeTimer=(m.fadeTimer||0)+dt;m.fadeAlpha=Math.max(0,1-m.fadeTimer/3000);
    if(m.fadeAlpha<=0){m.hp=0;killMonster(m);return;}
  }else{m.fadeAlpha=1;m.fadeTimer=0;}
  switch(m.spiritState){
    case 'passive':{
      m.idleTimer=(m.idleTimer||0)-dt;
      if(m.idleTimer<=0){
        if(Math.random()<0.3){const a=Math.random()*Math.PI*2;m.moveDir={x:Math.cos(a),y:Math.sin(a)};m.moveTimer=800+Math.random()*1200;m.idleTimer=m.moveTimer+2000+Math.random()*3000;}
        else{m.moveTimer=0;m.idleTimer=2000+Math.random()*3000;}
      }
      if(m.moveTimer>0){
        m.moveTimer-=dt;const s=m.sp*0.5*dt/16.67;
        const mx=canGo(m.x+m.moveDir.x*s,m.y),my=canGo(m.x,m.y+m.moveDir.y*s);
        if(mx)m.x+=m.moveDir.x*s;if(my)m.y+=m.moveDir.y*s;
        if(!mx&&!my){const a=Math.random()*Math.PI*2;m.moveDir={x:Math.cos(a),y:Math.sin(a)};}
        m.mv=true;
        // Direction inertia — lock to dominant axis, only update when clearly dominant
        const adx=Math.abs(m.moveDir.x),ady=Math.abs(m.moveDir.y);
        if(adx>ady*1.5)m.lockedDir=m.moveDir.x>0?'right':'left';
        else if(ady>adx*1.5)m.lockedDir=m.moveDir.y>0?'down':'up';
      }else{m.mv=false;}
      if(dp<TILE*4)m.spiritState='curious';
      break;
    }
    case 'curious':{
      const dx=pl.cx-m.cx,dy=pl.cy-m.cy,dd=Math.sqrt(dx*dx+dy*dy)||1;
      if(dp>TILE*2.5){const s=m.sp*0.55*dt/16.67;
        if(canGo(m.x+dx/dd*s,m.y))m.x+=dx/dd*s;if(canGo(m.x,m.y+dy/dd*s))m.y+=dy/dd*s;
        m.mv=true;
        const adx2=Math.abs(dx),ady2=Math.abs(dy);
        if(adx2>ady2*1.5)m.lockedDir=dx>0?'right':'left';
        else if(ady2>adx2*1.5)m.lockedDir=dy>0?'down':'up';
      }else{m.mv=false;}
      if(dp<TILE*2)m.spiritState='fleeing';
      if(dp>TILE*7)m.spiritState='passive';
      break;
    }
    case 'reactive':m.spiritState='fleeing';break;
    case 'fleeing':{
      const dx=m.cx-pl.cx,dy=m.cy-pl.cy,dd=Math.sqrt(dx*dx+dy*dy)||1;
      const wx=dx/dd+(Math.random()-0.5)*0.5,wy=dy/dd+(Math.random()-0.5)*0.5;
      const s=m.sp*0.9*dt/16.67;
      const mx=canGo(m.x+wx*s,m.y),my=canGo(m.x,m.y+wy*s);
      if(mx)m.x+=wx*s;if(my)m.y+=wy*s;
      if(!mx&&!my){const dirs=[{x:s,y:0},{x:-s,y:0},{x:0,y:s},{x:0,y:-s}];for(const d of dirs.sort(()=>Math.random()-0.5)){if(canGo(m.x+d.x,m.y+d.y)){m.x+=d.x;m.y+=d.y;break;}}}
      m.mv=true;
      if(Math.abs(wx)>Math.abs(wy)*1.5)m.lockedDir=wx>0?'right':'left';
      else if(Math.abs(wy)>Math.abs(wx)*1.5)m.lockedDir=wy>0?'down':'up';
      if(dp>TILE*12){m.spiritState='passive';m.fadeTimer=0;}
      break;
    }
  }
  if(m.mv){m.ft+=dt/16.67;if(m.ft>10){m.ft=0;m.fr=(m.fr+1)%3;}}else m.fr=0;
}

// ── DRAW SPIRIT ───────────────────────────────────────────────
function drawSpirit(m){
  const sx=m.cx-camX+(m.glitchX||0),sy=m.cy-camY+(m.glitchY||0);
  if(sx<-60||sx>canvas.width+60||sy<-60||sy>canvas.height+60)return;
  ctx.save();
  const alpha=m.fadeAlpha??1;
  let ba=alpha;
  if(m.spiritState==='fleeing')ba=alpha*(Math.sin(animTick*0.35)*0.15+0.85);
  ctx.globalAlpha=ba;
  const bob=Math.sin(animTick*0.055+(m.id%100))*3;

  // Fixed draw size — always identical
  const drawW=48, drawH=48;

  if(spiritSprLoaded){
    const img=document.getElementById('spiritImg');
    // Use locked direction — only changes when idle freezes it
    const dir=m.lockedDir||'down';
    const row=SPIRIT_DIR_ROW[dir]??0;
    const maxF=SPIRIT_DIR_FRAMES[dir]??2;
    const fr=Math.floor(m.fr||0)%maxF;
    if(m.spiritState==='fleeing'&&Math.random()<0.1){
      ctx.translate((Math.random()-0.5)*3,(Math.random()-0.5)*2);
    }
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(img,
      fr*SPIRIT_FRAME, row*SPIRIT_FRAME, SPIRIT_FRAME, SPIRIT_FRAME,
      sx-drawW/2, sy-drawH*0.85+bob, drawW, drawH);
  }

  // HP bar
  const bw=48; const barY=sy-drawH*0.85+bob-8;
  ctx.globalAlpha=ba*0.9;ctx.fillStyle='#060e18';ctx.fillRect(sx-bw/2,barY,bw,4);
  ctx.fillStyle=m.hp/m.maxHp>0.5?'#60d0ff':'#ff5050';ctx.fillRect(sx-bw/2,barY,bw*(m.hp/m.maxHp),4);
  ctx.globalAlpha=ba*0.8;ctx.fillStyle='#a8e8ff';ctx.font='bold 7px monospace';ctx.textAlign='center';
  ctx.fillText('Espírito do Tempo - Grau 1',sx,barY-3);
  ctx.restore();
}

// ── VERDICT SLASH FX ──────────────────────────────────────────
const verdictSlashes=[];
function spawnVerdictSlash(ax,ay,tx,ty){

}
function drawVerdictSlashes(dt){
  for(let i=verdictSlashes.length-1;i>=0;i--){
    const s=verdictSlashes[i];s.life-=dt;if(s.life<=0){verdictSlashes.splice(i,1);continue;}
    const t=1-s.life/s.maxLife;const sx=s.x-camX,sy=s.y-camY;
    const al=t<0.15?t/0.15:t<0.55?1:(1-t)/0.45;
    ctx.save();ctx.translate(sx,sy);ctx.rotate(s.angle);
    const len=TILE*2.2;const sp=(t<0.4?t/0.4:1-(t-0.4)/0.6)*24*Math.PI/180;
    for(let side=-1;side<=1;side+=2){
      ctx.save();ctx.rotate(side*sp);
      ctx.strokeStyle=`rgba(160,180,255,${al*0.3})`;ctx.lineWidth=16;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(-len*0.3,0);ctx.lineTo(len*0.7,0);ctx.stroke();
      ctx.strokeStyle=`rgba(210,220,255,${al*0.6})`;ctx.lineWidth=6;
      ctx.beginPath();ctx.moveTo(-len*0.3,0);ctx.lineTo(len*0.7,0);ctx.stroke();
      ctx.strokeStyle=`rgba(240,245,255,${al*0.95})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(-len*0.3,0);ctx.lineTo(len*0.7,0);ctx.stroke();
      ctx.restore();
    }
    if(t<0.45){const fl=t<0.2?t/0.2:(1-t/0.45);
      const g=ctx.createRadialGradient(0,0,0,0,0,TILE*0.65);
      g.addColorStop(0,`rgba(255,255,255,${fl*al*0.9})`);g.addColorStop(1,`rgba(100,140,255,0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,TILE*0.65,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }
}
// ── MONSTER AI ────────────────────────────────────────────────
function updateMonsters(dt){
  for(const m of [...monsters]){
    if(m.hp<=0)continue;
    if(m.isSpirit){updateSpiritAI(m,dt);continue;}
    m.aiTimer+=dt;m.meleeCd=Math.max(0,m.meleeCd-dt);
    m.hitFlash=Math.max(0,m.hitFlash-dt);m.frozen=Math.max(0,m.frozen-dt);
    applyZoneEffectsToMonster(m,dt);
    for(const sk of m.sks)sk.t=Math.max(0,sk.t-dt);
    if(Math.abs(m.kx)>0.1){m.x+=m.kx;m.kx*=0.76;}
    if(Math.abs(m.ky)>0.1){m.y+=m.ky;m.ky*=0.76;}
    if(m.frozen>0){m.mv=false;continue;}

    if(m.isGood){
      const evil=nearestEnemy(m.cx,m.cy,TILE*7,false);
      if(evil){
        const d=dst(m.cx,m.cy,evil.cx,evil.cy);
        if(Math.abs(evil.cx-m.cx)>Math.abs(evil.cy-m.cy))m.dir=(evil.cx>m.cx)?'right':'left';
        else m.dir=(evil.cy>m.cy)?'down':'up';
        if(d>m.sz+TILE*0.7){const dx=evil.x-m.x,dy=evil.y-m.y,dd=Math.sqrt(dx*dx+dy*dy)||1,s=m.sp*dt/16.67*TILE*0.065;if(canGo(m.x+dx/dd*s,m.y))m.x+=dx/dd*s;if(canGo(m.x,m.y+dy/dd*s))m.y+=dy/dd*s;m.mv=true;}
        else{m.mv=false;if(m.meleeCd<=0){m.meleeCd=1800;doDmg(evil,m.dmg+rnd(8),m.col);}
          for(const sk of m.sks){if(sk.t<=0&&d<=sk.rng){sk.t=sk.cd;doDmg(evil,sk.d+rnd(10),m.col);}}}
      }else{
        if(m.aiTimer>3000){m.aiTimer=0;m.px=m.px+(Math.random()-0.5)*TILE*5;m.py=m.py+(Math.random()-0.5)*TILE*5;m.px=Math.max(TILE*2,Math.min((MW-3)*TILE,m.px));m.py=Math.max(TILE*2,Math.min((MH-3)*TILE,m.py));}
        const dx=m.px-m.x,dy=m.py-m.y,d=Math.sqrt(dx*dx+dy*dy)||1,s=m.sp*0.5*dt/16.67*TILE*0.065;
        if(canGo(m.x+dx/d*s,m.y))m.x+=dx/d*s;if(canGo(m.x,m.y+dy/d*s))m.y+=dy/d*s;m.mv=true;
      }
      m.ft+=dt/16.67*0.6;if(m.ft>8){m.ft=0;m.fr=(m.fr+1)%3;}continue;
    }

    // EVIL
    const dp=dst(m.cx,m.cy,pl.cx,pl.cy);
    const da=an.dead?Infinity:dst(m.cx,m.cy,an.cx,an.cy);
    const nearGood=nearestEnemy(m.cx,m.cy,TILE*5,true);
    const dg=nearGood?dst(m.cx,m.cy,nearGood.cx,nearGood.cy):Infinity;
    if(dp<m.ag||da<m.ag*0.8||dg<m.ag*0.7)m.aggro=true;
    else if(dp>m.ag*2&&da>m.ag*2&&dg>m.ag*1.5)m.aggro=false;

    if(!m.aggro){
      if(m.aiTimer>2500+rnd(1500)){m.aiTimer=0;m.px+=(Math.random()-0.5)*TILE*5;m.py+=(Math.random()-0.5)*TILE*5;m.px=Math.max(TILE*2,Math.min((MW-3)*TILE,m.px));m.py=Math.max(TILE*2,Math.min((MH-3)*TILE,m.py));}
      const dx=m.px-m.x,dy=m.py-m.y,d=Math.sqrt(dx*dx+dy*dy)||1,s=m.sp*0.4*dt/16.67*TILE*0.065;
      if(canGo(m.x+dx/d*s,m.y))m.x+=dx/d*s;if(canGo(m.x,m.y+dy/d*s))m.y+=dy/d*s;m.mv=true;
      m.ft+=dt/16.67*0.5;if(m.ft>8){m.ft=0;m.fr=(m.fr+1)%3;}continue;
    }

    // Smart target — threatTarget wins if set
    const pratio=pl.hp/pl.maxHp,aratio=an.dead?1:an.hp/an.maxHp;
    let target='player',td=dp;
    if(m.threatTarget==='anubis'&&!an.dead){target='anubis';td=da;}
    else if(m.threatTarget==='player'){target='player';td=dp;}
    else if(!an.dead&&aratio<pratio&&da<dp){target='anubis';td=da;}
    if(nearGood&&dg<td*0.7){target='good';td=dg;}
    if(m.isBoss){target='player';td=dp;}
    const tx=target==='player'?pl.x:target==='anubis'?an.x:nearGood.x;
    const ty2=target==='player'?pl.y:target==='anubis'?an.y:nearGood.y;
    const dx=tx-m.x,dy=ty2-m.y,dd=Math.sqrt(dx*dx+dy*dy)||1;
    if(Math.abs(dx)>Math.abs(dy))m.dir=dx>0?'right':'left';else m.dir=dy>0?'down':'up';
    if(td>m.sz+TILE*0.7){const s=m.sp*dt/16.67*TILE*0.065;if(canGo(m.x+dx/dd*s,m.y))m.x+=dx/dd*s;if(canGo(m.x,m.y+dy/dd*s))m.y+=dy/dd*s;m.mv=true;}
    else{
      m.mv=false;
      if(m.meleeCd<=0){m.meleeCd=m.isBoss?1100:1700;const dmg=m.dmg+rnd(8);
        if(target==='player')hurtPlayer(dmg,m.col);
        else if(target==='anubis')hurtAnubis(dmg);
        else doDmg(nearGood,dmg,m.col);
        spawnFX(tx+TILE/2,ty2+TILE/2,'ring',m.col,TILE);}
    }
    for(const sk of m.sks){
      if(sk.t>0)continue;
      if(td<(sk.rng||TILE*2.5)){sk.t=sk.cd;const dmg=sk.d+rnd(12);
        if(target==='player')hurtPlayer(dmg,m.col);
        else if(target==='anubis')hurtAnubis(dmg);
        else doDmg(nearGood,dmg,m.col);
        spawnFX(m.cx,m.cy,'burst',m.col);spawnNum(m.cx-camX,m.cy-camY-40,sk.n,m.col);}
    }
    m.ft+=dt/16.67;if(m.ft>8){m.ft=0;m.fr=(m.fr+1)%3;}
  }
}

// ── CANWALK ───────────────────────────────────────────────────
function canGo(nx,ny){
  const m=7,pts=[[nx+m,ny+TILE*0.65],[nx+TILE-m,ny+TILE*0.65],[nx+m,ny+TILE-4],[nx+TILE-m,ny+TILE-4]];
  for(const [px,py] of pts){const c=Math.floor(px/TILE),r=Math.floor(py/TILE);if(c<0||c>=MW||r<0||r>=MH||BLK.has(tiles[r]?.[c]))return false;}
  return true;
}

// ── ZONE MECHANICS ────────────────────────────────────────────
let zoneEffects={
  slowField:false,hesitationDelay:0,hesitationActive:false,
  glitchControlTimer:0,controlsInverted:false,
};
function inZone(tx,ty,z){
  if(z==='calm') return (ty>=3&&ty<=20&&tx>=3&&tx<=24)||(ty>=3&&ty<=15&&tx>=32&&tx<=52);
  if(z==='unstable') return (ty>=18&&ty<=38&&tx>=38&&tx<=54)||(ty>=18&&ty<=38&&tx>=2&&tx<=16);
  if(z==='fractured') return ty>=34&&ty<=52&&tx>=14&&tx<=42;
  if(z==='correction') return ty>=38&&ty<=52&&tx>=2&&tx<=13;
  if(z==='throne') return ty>=23&&ty<=32&&tx>=20&&tx<=35;
  return false;
}
function isHesitationTile(tx,ty){
  if(!inZone(tx,ty,'unstable'))return false;
  return(tx+ty)%5===0&&Math.sin(tx*31+ty*17)>0.4;
}
function isAcceleratorTile(tx,ty){
  return inZone(tx,ty,'unstable')&&((tx>=45&&tx<=47)||(tx>=7&&tx<=9));
}
function isSlowField(tx,ty){
  if(!inZone(tx,ty,'calm'))return false;
  return(tx>=9&&tx<=18&&ty>=9&&ty<=13)||(tx>=36&&tx<=47&&ty>=5&&ty<=13);
}
function inCorrectionZone(ty,tx){
  if(tx===undefined)return ty>=38&&ty<=52;
  return inZone(tx,ty,'correction');
}
function inThroneZone(ty,tx){
  if(tx===undefined)return ty>=23&&ty<=32;
  return inZone(tx,ty,'throne');
}

function dtile(x,y,t,tx,ty){
  const s=TILE;ctx.save();ctx.beginPath();ctx.rect(x,y,s,s);ctx.clip();
  const z=inZone(tx,ty,'calm')?0:inZone(tx,ty,'unstable')?1:inZone(tx,ty,'fractured')?2:inZone(tx,ty,'correction')?3:inZone(tx,ty,'throne')?4:0;
  const ZV=['#0d1f35','#12082a','#1f0808','#040f1a','#1a1200'];
  const ZF=['#162840','#1a0d38','#280d0d','#061520','#221a00'];
  const ZF2=['#1e3550','#240f48','#321010','#081c28','#2a2200'];
  const ZGB=['#80d0ff','#c080ff','#ff8060','#60d0f0','#ffd060'];
  const ZPC=[[96,200,255],[176,96,255],[255,64,32],[64,176,224],[232,192,64]];

  if(t===T.VOID){
    ctx.fillStyle=ZV[z];ctx.fillRect(x,y,s,s);
    ctx.strokeStyle=ZF2[z];ctx.lineWidth=0.5;ctx.globalAlpha=0.35;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+s);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+s,y);ctx.stroke();
    ctx.globalAlpha=1;
    ctx.fillStyle=ZF[z];ctx.fillRect(x+s/2-1,y+s/2-1,2,2);
  }
  else if(t===T.WALL){
    const wc=z===4?'#2a1e00':z===3?'#060c18':'#0e0818';
    const bc=z===4?'#1a1200':z===3?'#040a10':'#08040f';
    const hc=z===4?'#50380a':z===3?'#102030':'#200a3a';
    ctx.fillStyle=wc;ctx.fillRect(x,y,s,s);
    ctx.fillStyle=bc;
    for(let r=0;r<3;r++){const o=(r%2)*16;for(let c=-1;c<3;c++)ctx.fillRect(x+c*32+o,y+r*16,30,14);}
    ctx.fillStyle=hc;ctx.fillRect(x,y,s,2);
  }
  else if(t===T.FLOOR){
    ctx.fillStyle=ZF[z];ctx.fillRect(x,y,s,s);
    ctx.fillStyle=ZF2[z];ctx.fillRect(x,y,s,1);ctx.fillRect(x,y,1,s);
    ctx.fillStyle=ZV[z];ctx.fillRect(x+8,y+8,s-16,s-16);
    ctx.fillStyle=ZF2[z];ctx.fillRect(x+8,y+8,s-16,1);ctx.fillRect(x+8,y+8,1,s-16);
  }
  else if(t===T.GOLD){
    ctx.fillStyle=ZF[z];ctx.fillRect(x,y,s,s);
    ctx.fillStyle=ZV[z];ctx.fillRect(x+4,y+4,s-8,s-8);
    ctx.fillStyle=ZGB[z];
    ctx.fillRect(x,y,s,3);ctx.fillRect(x,y+s-3,s,3);
    ctx.fillRect(x,y,3,s);ctx.fillRect(x+s-3,y,3,s);
    ctx.fillRect(x,y,6,6);ctx.fillRect(x+s-6,y,6,6);
    ctx.fillRect(x,y+s-6,6,6);ctx.fillRect(x+s-6,y+s-6,6,6);
  }
  else if(t===T.PATH){
    ctx.fillStyle=ZV[z];ctx.fillRect(x,y,s,s);
    const g=Math.sin(animTick*0.06+tx+ty)*0.3+0.6;
    const [pr,pg,pb]=ZPC[z];
    ctx.fillStyle=`rgba(${pr},${pg},${pb},${g*0.15})`;ctx.fillRect(x,y,s,s);
    ctx.fillStyle=`rgba(${pr},${pg},${pb},${g})`;
    ctx.fillRect(x+s/2-2,y,4,s);ctx.fillRect(x,y+s/2-2,s,4);
    ctx.fillStyle=`rgba(255,255,255,${g*0.6})`;
    ctx.fillRect(x+s/2-1,y,2,s);ctx.fillRect(x,y+s/2-1,s,2);
  }
  else if(t===T.MAGIC){
    ctx.fillStyle=ZF[z];ctx.fillRect(x,y,s,s);
    const p=Math.sin(animTick*0.07+tx*0.5+ty*0.5)*0.3+0.7;
    ctx.strokeStyle=ZGB[z];ctx.lineWidth=2;ctx.globalAlpha=p;
    ctx.beginPath();ctx.arc(x+s/2,y+s/2,s/2-4,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(x+s/2,y+s/2,s/2-12,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=ZGB[z];
    ctx.beginPath();ctx.arc(x+s/2,y+s/2,4,0,Math.PI*2);ctx.fill();
    for(let i=0;i<4;i++){const a=i*Math.PI/2+animTick*0.03;ctx.beginPath();ctx.arc(x+s/2+Math.cos(a)*(s/2-8),y+s/2+Math.sin(a)*(s/2-8),2,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;
  }
  // ── Slow field highlight in Calm Zone ─────────────────────
  if(ty>=2&&ty<=14&&isSlowField(tx,ty)){
    const sf=Math.sin(animTick*0.04+tx+ty)*0.12+0.15;
    ctx.fillStyle=`rgba(80,200,255,${sf})`;ctx.fillRect(x,y,s,s);
    ctx.strokeStyle=`rgba(120,220,255,${sf*2})`;ctx.lineWidth=1;
    ctx.strokeRect(x+2,y+2,s-4,s-4);
  }
  // ── Hesitation tile highlight in Unstable Zone ────────────
  if(ty>=17&&ty<=28&&isHesitationTile(tx,ty)){
    const hf=Math.sin(animTick*0.08+tx*2+ty)*0.1+0.12;
    ctx.fillStyle=`rgba(180,80,255,${hf})`;ctx.fillRect(x,y,s,s);
  }
  // ── Accelerator corridor highlight ────────────────────────
  if(isAcceleratorTile(tx,ty)){
    const af=Math.sin(animTick*0.1+ty)*0.2+0.3;
    ctx.fillStyle=`rgba(200,100,255,${af})`;
    ctx.fillRect(x+s/2-3,y,6,s);
  }
  else if(t===T.STAIR){
    ctx.fillStyle=ZF[z];ctx.fillRect(x,y,s,s);
    for(let i=0;i<4;i++){ctx.fillStyle=ZGB[z];ctx.globalAlpha=0.15+i*0.15;ctx.fillRect(x+i*6,y+i*6,s-i*12,s-i*12);}
    ctx.globalAlpha=1;ctx.strokeStyle=ZGB[z];ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(x+s/2,y+s/2,s/2-6,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=ZGB[z];ctx.beginPath();ctx.arc(x+s/2,y+s/2,5,0,Math.PI*2);ctx.fill();
  }
  else if(t===T.CLOCK){
    ctx.fillStyle=ZF[z];ctx.fillRect(x,y,s,s);
    ctx.fillStyle='#2a1848';ctx.fillRect(x+s/2-16,y+s-12,32,12);ctx.fillRect(x+s/2-12,y+s-18,24,6);
    ctx.fillStyle='#0a0818';ctx.beginPath();ctx.arc(x+s/2,y+18,15,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#d4a030';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+s/2,y+18,15,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#e8c050';
    for(let i=0;i<12;i++){const a=i*Math.PI/6-Math.PI/2;ctx.fillRect(x+s/2+Math.cos(a)*12-.5,y+18+Math.sin(a)*12-.5,2,2);}
    const ha=animTick*0.02;
    ctx.strokeStyle='#ffffc0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+s/2,y+18);ctx.lineTo(x+s/2+Math.cos(ha-Math.PI/2)*10,y+18+Math.sin(ha-Math.PI/2)*10);ctx.stroke();
    ctx.strokeStyle='#ffa030';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+s/2,y+18);ctx.lineTo(x+s/2+Math.cos(ha*12-Math.PI/2)*7,y+18+Math.sin(ha*12-Math.PI/2)*7);ctx.stroke();
    ctx.fillStyle='#ffd060';ctx.beginPath();ctx.arc(x+s/2,y+18,2,0,Math.PI*2);ctx.fill();
  }
  else if(t===T.PORTAL){
    ctx.fillStyle=ZF[z];ctx.fillRect(x,y,s,s);
    const pr=Math.sin(animTick*0.08+tx+ty)*0.25+0.75;
    ctx.fillStyle=`rgba(80,20,180,${pr*0.5})`;ctx.beginPath();ctx.arc(x+s/2,y+s/2,s/2-2,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=`rgba(200,100,255,${pr})`;ctx.lineWidth=4;ctx.beginPath();ctx.arc(x+s/2,y+s/2,s/2-6,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle=`rgba(255,200,255,${pr*0.6})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+s/2,y+s/2,s/2-14,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=`rgba(255,255,255,${pr*0.9})`;ctx.beginPath();ctx.arc(x+s/2,y+s/2,5,0,Math.PI*2);ctx.fill();
    for(let i=0;i<8;i++){const a=animTick*0.07+i*Math.PI/4;ctx.fillStyle=`rgba(220,160,255,${pr*0.8})`;ctx.fillRect(x+s/2+Math.cos(a)*(s/2-10)-2,y+s/2+Math.sin(a)*(s/2-10)-2,4,4);}
  }
  else if(t===T.LAVA){
    ctx.fillStyle='#200404';ctx.fillRect(x,y,s,s);
    const lv=Math.sin(animTick*0.06+tx*0.5+ty*0.4)*0.35+0.65;
    ctx.fillStyle=`rgba(255,60,20,${lv*0.7})`;ctx.fillRect(x+3,y+3,s-6,s-6);
    ctx.fillStyle=`rgba(255,180,0,${lv*0.5})`;ctx.fillRect(x+10,y+10,s-20,s-20);
    ctx.fillStyle=`rgba(255,255,200,${lv*0.3})`;ctx.fillRect(x+s/2-2,y+4,4,s-8);
  }
  else if(t===T.ICE){
    ctx.fillStyle='#080f18';ctx.fillRect(x,y,s,s);
    ctx.fillStyle='#0f1f35';ctx.fillRect(x+2,y+2,s-4,s-4);
    ctx.fillStyle='rgba(140,210,255,0.5)';
    ctx.fillRect(x,y,s,2);ctx.fillRect(x,y+s-2,s,2);
    ctx.fillRect(x,y,2,s);ctx.fillRect(x+s-2,y,2,s);
    const ic=Math.sin(animTick*0.04+tx+ty)*0.2+0.3;
    ctx.fillStyle=`rgba(180,230,255,${ic})`;
    ctx.fillRect(x+s/2-1,y+4,2,s-8);ctx.fillRect(x+4,y+s/2-1,s-8,2);
    ctx.fillStyle=`rgba(220,245,255,${ic*0.6})`;ctx.fillRect(x+s/2-4,y+s/2-4,8,8);
  }
  ctx.restore();
}

// ── DRAW MONSTER ──────────────────────────────────────────────
function drawMonster(m){
  const sx=m.cx-camX,sy=m.cy-camY;
  if(sx<-80||sx>canvas.width+80||sy<-80||sy>canvas.height+80)return;
  ctx.save();
  if(m.frozen>0){ctx.fillStyle='rgba(100,200,255,0.22)';ctx.beginPath();ctx.arc(sx,sy,m.sz+10,0,Math.PI*2);ctx.fill();}
  const pulse=Math.sin(animTick*0.1+m.id)*0.15+0.85;
  ctx.fillStyle=hexA(m.col,m.aggro?0.28:0.1);ctx.beginPath();ctx.arc(sx,sy,m.sz+8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=m.hitFlash>100?'#ffffff':m.col;ctx.beginPath();ctx.arc(sx,sy,m.sz,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.arc(sx,sy,m.sz*0.55,0,Math.PI*2);ctx.fill();
  const eyeR=m.sz*0.22,ex=m.sz*0.32,ey=m.sz*0.2;
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(sx-ex,sy-ey,eyeR,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(sx+ex,sy-ey,eyeR,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=m.isGood?'#80ffcc':(m.aggro?(m.isBoss?'#ffd700':'#ff3030'):'#fff');
  ctx.beginPath();ctx.arc(sx-ex,sy-ey,eyeR*0.42,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(sx+ex,sy-ey,eyeR*0.42,0,Math.PI*2);ctx.fill();
  if(m.isGood){ctx.fillStyle='rgba(128,255,200,0.12)';ctx.beginPath();ctx.arc(sx,sy,m.sz+14,0,Math.PI*2);ctx.fill();}
  if(m.isBoss){ctx.fillStyle='#ffd700';ctx.fillRect(sx-13,sy-m.sz-8,26,7);[[-10,-12],[-2,-15],[7,-12]].forEach(([ox,oy])=>ctx.fillRect(sx+ox-2,sy+m.sz+oy,5,5));}
  const bw=m.sz*2.6;ctx.fillStyle='#200020';ctx.fillRect(sx-bw/2,sy-m.sz-18,bw,6);
  ctx.fillStyle=m.isGood?'#60ff80':m.hp/m.maxHp>0.5?m.col:m.hp/m.maxHp>0.25?'#ffa020':'#ff2020';
  ctx.fillRect(sx-bw/2,sy-m.sz-18,bw*(m.hp/m.maxHp),6);
  ctx.fillStyle=m.isBoss?'#ffd700':(m.isGood?'#80ffcc':'#ddd');
  ctx.font=`${m.isBoss?'bold ':''}${m.isBoss?10:8}px monospace`;ctx.textAlign='center';ctx.fillText(m.name,sx,sy-m.sz-21);
  ctx.restore();
}

function hexA(hex,a){
  if(!hex||hex.length<4)return`rgba(128,128,128,${a})`;
  const r=parseInt(hex.slice(1,3),16)||0,g=parseInt(hex.slice(3,5),16)||0,b=parseInt(hex.slice(5,7),16)||0;
  return`rgba(${r},${g},${b},${a})`;
}

function drawNPCs(){
  const px=Math.floor(pl.cx/TILE),py=Math.floor(pl.cy/TILE);
  for(const npc of NPCS){
    const sx=npc.tx*TILE+TILE/2-camX,sy=npc.ty*TILE+TILE*0.7-camY;
    if(sx<-60||sx>canvas.width+60||sy<-60||sy>canvas.height+60)continue;
    const bob=Math.sin(animTick*0.05+npc.tx)*4;
    ctx.save();
    ctx.fillStyle=hexA(npc.color,0.18);ctx.beginPath();ctx.arc(sx,sy+bob,22,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=npc.color;ctx.beginPath();ctx.arc(sx,sy+bob,14,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.8)';ctx.beginPath();ctx.arc(sx-4,sy+bob-3,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(sx+4,sy+bob-3,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx-4,sy+bob-3,1.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(sx+4,sy+bob-3,1.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=npc.color;ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.fillText(npc.name,sx,sy+bob-20);
    if(Math.abs(npc.tx-px)<=2&&Math.abs(npc.ty-py)<=2){ctx.fillStyle='#fff';ctx.font='8px monospace';ctx.fillText('● Falar',sx,sy+bob+20);}

  for(const ch of CHESTS){

    const g=Math.sin(animTick*0.08+ch.tx)*0.3+0.5;
    ctx.save();
    ctx.fillStyle=hexA(ch.color,g*0.25);ctx.beginPath();ctx.arc(sx,sy,22,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3a2808';ctx.fillRect(sx-14,sy-10,28,20);
    ctx.fillStyle=ch.color;ctx.fillRect(sx-14,sy-10,28,8);
    ctx.fillStyle='#1a1005';ctx.fillRect(sx-14,sy-2,28,2);
    ctx.fillStyle='#e8c060';ctx.fillRect(sx-3,sy-4,6,6);
    ctx.fillStyle=ch.color;ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.fillText('💰',sx,sy-16);
    ctx.restore();
  }
}

// ── ATTACK ANIM ───────────────────────────────────────────────
function drawAtkAnim(){
  if(pl.atkAnim<=0)return;
  const a=pl.atkAnim/280,ang=Math.atan2(pl.atkAnimDir.y,pl.atkAnimDir.x);
  const sx=pl.cx-camX+pl.atkAnimDir.x*TILE*0.8,sy=pl.cy-camY+pl.atkAnimDir.y*TILE*0.8;
  ctx.save();ctx.globalAlpha=a;
  ctx.strokeStyle=`rgba(255,220,255,${a})`;ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(sx,sy,TILE*0.75,ang-1.1,ang+1.1);ctx.stroke();
  ctx.beginPath();ctx.arc(sx,sy,TILE*0.45,ang+1.1,ang-1.1);ctx.stroke();
  ctx.lineWidth=1.5;
  for(let i=-1;i<=1;i++){const a2=ang+i*0.35;ctx.beginPath();ctx.moveTo(pl.cx-camX+Math.cos(a2)*12,pl.cy-camY+Math.sin(a2)*12);ctx.lineTo(pl.cx-camX+Math.cos(a2)*TILE*1.35,pl.cy-camY+Math.sin(a2)*TILE*1.35);ctx.stroke();}

}

// ── DIALOG/INTERACT ───────────────────────────────────────────
function checkInteract(){
  if(dlgOpen)return;
  const px=Math.floor(pl.cx/TILE),py=Math.floor(pl.cy/TILE);
  for(const ch of CHESTS){
    if(ch.done)continue;
    if(Math.abs(ch.tx-px)<=2&&Math.abs(ch.ty-py)<=2){
      ch.done=true;playerGold+=ch.gold;sndGold();
      showNotif(`💰 Cofre! +${ch.gold} moedas`,'#e8c060');
      questProgress('chest','');updateHUD();return;
    }
  }
  for(const npc of NPCS){
    if(Math.abs(npc.tx-px)<=2&&Math.abs(npc.ty-py)<=2){
      dlgObj=npc;dlgOpen=true;dlgPage=npc.talked?Math.min(1,npc.dialogs.length-1):0;dlgIdx=0;
      const page=npc.dialogs[dlgPage];
      document.getElementById('dlgname').textContent=npc.name;
      document.getElementById('dlgtext').textContent=page[0];
      document.getElementById('dlg').style.display='block';
      questProgress('talk',npc.id);
      if(npc.shop&&playerGold>=100){playerGold-=100;pl.hp=pl.maxHp;sndRegen();showNotif('❤️ Vida restaurada!','#ff6080');updateHUD();}
      return;
    }
  }
}
function advanceDlg(){
  if(!dlgOpen)return;
  const page=dlgObj.dialogs[dlgPage];
  dlgIdx++;
  if(dlgIdx<page.length)document.getElementById('dlgtext').textContent=page[dlgIdx];
  else{document.getElementById('dlg').style.display='none';dlgObj.talked=true;dlgOpen=false;}
}

// ── MAIN LOOP ─────────────────────────────────────────────────
function loop(ts){
  const dt=Math.min(ts-lastT,80);lastT=ts;animTick++;
  const cw=sf.clientWidth,ch=sf.clientHeight;
  if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch;}

  if(!dlgOpen){
    let dx=0,dy=0;
    if(keys.up){dy=-1;pl.dir='up';}if(keys.down){dy=1;pl.dir='down';}
    if(keys.left){dx=-1;pl.dir='left';}if(keys.right){dx=1;pl.dir='right';}
    if(dx&&dy){dx*=0.707;dy*=0.707;}
    pl.mv=!!(dx||dy);
    // Apply zone effects to movement
    if(zoneEffects.controlsInverted){dx=-dx;dy=-dy;}
    if(zoneEffects.hesitationActive){dx=0;dy=0;}
    // Slow field: reduce speed; accelerator corridor: boost speed
    const inAccel=isAcceleratorTile(Math.floor(pl.cx/TILE),Math.floor(pl.cy/TILE));
    const moveMult=zoneEffects.slowField?0.6:inAccel?1.22:1;
    if(pl.mv){
      const sp=pl.sp*dt/16.67*moveMult;
      if(canGo(pl.x+dx*sp,pl.y))pl.x+=dx*sp;if(canGo(pl.x,pl.y+dy*sp))pl.y+=dy*sp;
      pl.ft+=dt/16.67;if(pl.ft>8){pl.ft=0;pl.fr=(pl.fr+1)%3;}
      if(animTick%20===0)sndWalk();
    }else pl.fr=1;
    pl.x=Math.max(TILE,Math.min((MW-2)*TILE,pl.x));pl.y=Math.max(TILE,Math.min((MH-2)*TILE,pl.y));
  }

  if(Math.abs(pl.kx)>0.1){pl.x+=pl.kx;pl.kx*=0.78;}if(Math.abs(pl.ky)>0.1){pl.y+=pl.ky;pl.ky*=0.78;}
  pl.invTimer=Math.max(0,pl.invTimer-dt);pl.atkCd=Math.max(0,pl.atkCd-dt);pl.atkAnim=Math.max(0,pl.atkAnim-dt);

  // ── ZONE MECHANICS UPDATE ────────────────────────────────────
  const plTX=Math.floor(pl.cx/TILE),plTY=Math.floor(pl.cy/TILE);

  // Hesitation tile (Unstable Zone) — freeze movement briefly
  if(isHesitationTile(plTX,plTY)&&!zoneEffects.hesitationActive&&zoneEffects.hesitationDelay<=0){
    zoneEffects.hesitationActive=true;
    zoneEffects.hesitationDelay=320;
    spawnNum(pl.cx-camX,pl.cy-camY-20,'⏸','#c080ff');
  }
  if(zoneEffects.hesitationActive){
    zoneEffects.hesitationDelay-=dt;
    if(zoneEffects.hesitationDelay<=0){zoneEffects.hesitationActive=false;zoneEffects.hesitationDelay=1200;}
  } else if(zoneEffects.hesitationDelay>0) zoneEffects.hesitationDelay-=dt;

  // Slow field (Calm Zone) — detect if player is in slow/regen area
  zoneEffects.slowField=isSlowField(plTX,plTY);

  // Glitch control inversion (Fractured Zone)
  if(plTY>=31&&plTY<=40){
    zoneEffects.glitchControlTimer-=dt;
    if(zoneEffects.glitchControlTimer<=0){
      zoneEffects.glitchControlTimer=8000+Math.random()*4000;
      if(Math.random()<0.4){
        zoneEffects.controlsInverted=true;
        setTimeout(()=>{zoneEffects.controlsInverted=false;},500+Math.random()*500);
        spawnNum(pl.cx-camX,pl.cy-camY-20,'⚡','#ff4020');
      }
    }
  } else {zoneEffects.controlsInverted=false;zoneEffects.glitchControlTimer=0;}

  // Fissure damage (Fractured Zone) — lava tiles hurt
  if(tiles[plTY]?.[plTX]===T.LAVA||(tiles[plTY]?.[plTX+1]===T.LAVA&&pl.cx%TILE<8)||(tiles[plTY]?.[plTX-1]===T.LAVA&&pl.cx%TILE>TILE-8)){
    if(pl.invTimer<=0){hurtPlayer(10*dt/1000*60,'#ff4020');}
  }

  // Correction Zone — no passive regen
  // Throne Zone — fast regen (3x)
  const regenMult=inThroneZone(plTY,plTX)?3:inCorrectionZone(plTY,plTX)?0:zoneEffects.slowField?1.5:1;

  pl.regenTimer+=dt;
  if(pl.regenTimer>5000/regenMult&&pl.hp<pl.maxHp&&regenMult>0){
    pl.regenTimer=0;pl.hp=Math.min(pl.maxHp,pl.hp+8*regenMult);sndRegen();updateHUD();
  }
  SKILLS.forEach(sk=>sk.curCd=Math.max(0,sk.curCd-dt));
  spawnTimer+=dt;if(spawnTimer>6000){spawnTimer=0;spawnMonster();if(Math.random()<0.3)spawnSpirit();}
  // Throne zone — save on entry
  if(inZone(plTX,plTY,'throne')&&!zoneEffects.throneEntered){
    zoneEffects.throneEntered=true;
    saveGame();
  }else if(!inZone(plTX,plTY,'throne')){
    zoneEffects.throneEntered=false;
  }
  updateAnubis(dt);updateMonsters(dt);updateDragons(dt);

  camX+=(pl.x-cw/2+TILE/2-camX)*0.14*dt/16.67;camY+=(pl.y-ch/2+TILE/2-camY)*0.14*dt/16.67;
  camX=Math.max(0,Math.min(MW*TILE-cw,camX));camY=Math.max(0,Math.min(MH*TILE-ch,camY));

  ctx.fillStyle='#080010';ctx.fillRect(0,0,cw,ch);
  const sc=Math.max(0,Math.floor(camX/TILE)),ec=Math.min(MW-1,Math.ceil((camX+cw)/TILE));
  const sr=Math.max(0,Math.floor(camY/TILE)),er=Math.min(MH-1,Math.ceil((camY+ch)/TILE));
  for(let r=sr;r<=er;r++)for(let c=sc;c<=ec;c++)dtile(c*TILE-Math.floor(camX),r*TILE-Math.floor(camY),tiles[r]?.[c]??T.VOID,c,r);

  // ── ZONE ATMOSPHERE EFFECTS ───────────────────────────────
  const plZoneRow=Math.floor((pl.y+TILE/2)/TILE);
  const plZoneCol=Math.floor((pl.x+TILE/2)/TILE);
  const plZoneName=inZone(plZoneCol,plZoneRow,'throne')?'throne':inZone(plZoneCol,plZoneRow,'correction')?'correction':inZone(plZoneCol,plZoneRow,'fractured')?'fractured':inZone(plZoneCol,plZoneRow,'unstable')?'unstable':inZone(plZoneCol,plZoneRow,'calm')?'calm':'void';
  // Calm Zone (2-14): gentle floating particles
  if(plZoneName==='calm'){
    for(let i=0;i<3;i++){
      const px=((animTick*0.3+i*200)%(canvas.width+40))-20;
      const py=((animTick*0.15+i*150)%(canvas.height+40))-20;
      const a=Math.sin(animTick*0.04+i)*0.15+0.1;
      ctx.fillStyle=`rgba(100,200,255,${a})`;
      ctx.beginPath();ctx.arc(px,py,2+Math.sin(animTick*0.05+i)*1,0,Math.PI*2);ctx.fill();
    }
  }
  // Unstable Zone (17-28): flickering distortion lines
  else if(plZoneName==='unstable'){
    if(Math.random()<0.08){
      const ly=Math.random()*canvas.height;
      ctx.fillStyle='rgba(160,80,255,0.06)';
      ctx.fillRect(0,ly,canvas.width,1+Math.random()*2);
    }
    // Floating purple orbs
    for(let i=0;i<2;i++){
      const px=((animTick*0.4+i*300)%(canvas.width+60))-30;
      const py=((animTick*0.2+i*250+100)%(canvas.height+60))-30;
      const a=Math.sin(animTick*0.06+i)*0.12+0.08;
      ctx.fillStyle=`rgba(180,80,255,${a})`;
      ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();
    }
  }
  // Fractured Zone (31-40): red glitch flashes
  else if(plZoneName==='fractured'){
    if(Math.random()<0.04){
      ctx.fillStyle='rgba(255,30,30,0.04)';
      ctx.fillRect(0,Math.random()*canvas.height,canvas.width,Math.random()*3+1);
    }
    if(Math.random()<0.02){
      const gx=Math.random()*canvas.width;
      ctx.fillStyle='rgba(255,100,50,0.12)';
      ctx.fillRect(gx,0,Math.random()*3+1,canvas.height);
    }
  }
  // Correction Zone (43-49): heavy blue pressure vignette
  else if(plZoneName==='correction'){
    const vg=ctx.createRadialGradient(canvas.width/2,canvas.height/2,canvas.height*0.25,canvas.width/2,canvas.height/2,canvas.height*0.75);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,20,60,0.35)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  // Throne Zone (50-54): golden shimmer
  else if(plZoneName==='throne'){
    const a=Math.sin(animTick*0.03)*0.04+0.03;
    ctx.fillStyle=`rgba(200,160,0,${a})`;ctx.fillRect(0,0,canvas.width,canvas.height);
    for(let i=0;i<2;i++){
      const px=((animTick*0.25+i*400)%(canvas.width+60))-30;
      const py=((animTick*0.12+i*300)%(canvas.height+60))-30;
      ctx.fillStyle=`rgba(255,220,80,0.12)`;
      ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();
    }
  }


  particles=particles.filter(p=>{
    p.life-=dt;if(p.life<=0)return false;const a=p.life/p.maxLife;ctx.save();ctx.globalAlpha=a;
    if(p.type==='ring'){p.r+=(p.maxR-p.r)*dt/p.maxLife*2.5;ctx.strokeStyle=p.col;ctx.lineWidth=2*(0.5+a*0.5);ctx.beginPath();ctx.arc(p.x-camX,p.y-camY,p.r,0,Math.PI*2);ctx.stroke();}
    else if(p.type==='dot'){p.x+=p.vx;p.y+=p.vy;p.vx*=0.92;p.vy*=0.92;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x-camX,p.y-camY,p.size*a,0,Math.PI*2);ctx.fill();}
    ctx.restore();return true;
  });

  drawNPCs();
  for(const m of monsters)m.isSpirit?drawSpirit(m):drawMonster(m);
  drawDragons();

  if(!an.dead){
    const afx=an.cx-camX,afy=an.cy-camY+TILE*0.5;
    ctx.save();ctx.fillStyle='rgba(0,80,255,0.18)';ctx.beginPath();ctx.ellipse(afx,afy+TILE*0.1,14,4,0,0,Math.PI*2);ctx.closePath();ctx.fill();ctx.restore();
    if(anSkillAnim){
      anSkillAnim.timer+=dt;
      if(anSkillAnim.timer>=AN_SKILL_DUR){anSkillAnim.timer=0;anSkillAnim.frame++;}
      if(anSkillAnim.frame>=AN_SKILL_TOTAL)anSkillAnim=null;
    }
    if(anSkillAnim&&anSkillSprLoaded){
      const img=document.getElementById('anSkillImg');
      const row=AN_SKILL_ROWS[anSkillAnim.dir]??0;
      const fr=Math.min(anSkillAnim.frame,AN_SKILL_TOTAL-1);
      ctx.save();ctx.imageSmoothingEnabled=false;
      ctx.drawImage(img,fr*AN_SKILL_FRAME,row*AN_SKILL_FRAME,AN_SKILL_FRAME,AN_SKILL_FRAME,afx-23,afy-42,46,46);
      ctx.restore();
    }else{
      ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(anSpr,an.fr*32,DR[an.dir]*32,32,32,afx-23,afy-42,46,46);ctx.restore();
    }
    ctx.save();ctx.fillStyle='#60c0ff';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.fillText('Anúbis',afx,afy-46);ctx.restore();
  }

  
  // Zone name HUD
  const znames={calm:'⬜ Zona Calma — Nascimento do Tempo',unstable:'🌀 Zona Instável',fractured:'💀 Zona Fraturada',correction:'❄️ Zona de Correção',throne:'👑 Trono do Soberano'};
  let zname=znames[plZoneName]||'';
  ctx.save();ctx.globalAlpha=0.7;ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.fillRect(canvas.width/2-90,canvas.height-32,180,18);
  ctx.fillStyle='#c0e0ff';ctx.font='8px monospace';ctx.textAlign='center';
  ctx.fillText(zname,canvas.width/2,canvas.height-20);ctx.restore();

  // ── SLOW FIELD VISUAL (Calm Zone) ──────────────────────────
  if(zoneEffects.slowField){
    const sfx=pl.cx-camX,sfy=pl.cy-camY;
    const sg=ctx.createRadialGradient(sfx,sfy,10,sfx,sfy,TILE*1.5);
    sg.addColorStop(0,'rgba(80,180,255,0.12)');sg.addColorStop(1,'rgba(80,180,255,0)');
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sfx,sfy,TILE*1.5,0,Math.PI*2);ctx.fill();
    // Regen indicator
    ctx.fillStyle='rgba(80,200,255,0.7)';ctx.font='8px monospace';ctx.textAlign='center';
    ctx.fillText('⟳ HP',sfx,sfy-TILE*0.9);
  }

  // ── HESITATION VISUAL (Unstable Zone) ──────────────────────
  if(zoneEffects.hesitationActive){
    ctx.save();ctx.globalAlpha=0.25;ctx.fillStyle='#c080ff';
    ctx.fillRect(0,0,canvas.width,canvas.height);ctx.restore();
  }

  // ── CONTROL INVERSION VISUAL (Fractured Zone) ──────────────
  if(zoneEffects.controlsInverted){
    ctx.save();ctx.globalAlpha=0.2;ctx.fillStyle='#ff4020';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.globalAlpha=0.9;ctx.fillStyle='#ff6040';ctx.font='bold 11px monospace';ctx.textAlign='center';
    ctx.fillText('⚡ CONTROLES INVERTIDOS',canvas.width/2,40);ctx.restore();
  }

  // ── CORRECTION ZONE NO-REGEN WARNING ───────────────────────
  if(inZone(plTX,plTY,'correction')){
    ctx.save();ctx.globalAlpha=0.7;ctx.fillStyle='#4080a0';ctx.font='8px monospace';ctx.textAlign='center';
    ctx.fillText('❄️ Sem regeneração',canvas.width/2,canvas.height-45);ctx.restore();
  }

  // ── THRONE ZONE REGEN VISUAL ────────────────────────────────
  if(inZone(plTX,plTY,'throne')){
    ctx.save();ctx.globalAlpha=0.6;ctx.fillStyle='#e8c040';ctx.font='8px monospace';ctx.textAlign='center';
    ctx.fillText('✦ Regeneração acelerada',canvas.width/2,canvas.height-45);ctx.restore();
  }

  // ── ACCELERATOR CORRIDOR VISUAL (Unstable Zone) ─────────────
  if(isAcceleratorTile(plTX,plTY)){
    ctx.save();ctx.globalAlpha=0.5;ctx.fillStyle='#c080ff';ctx.font='8px monospace';ctx.textAlign='center';
    ctx.fillText('▲ Velocidade aumentada',canvas.width/2,canvas.height-45);ctx.restore();
  }

  drawAtkAnim();
  drawVerdictSlashes(Math.min(ts-lastT,80));

  if(pl.invTimer<=0||Math.floor(animTick/3)%2===0){
    const pfx=pl.cx-camX,pfy=pl.cy-camY+TILE*0.5;
    ctx.save();ctx.fillStyle='rgba(80,0,180,0.18)';ctx.beginPath();ctx.ellipse(pfx,pfy+TILE*0.1,14,4,0,0,Math.PI*2);ctx.closePath();ctx.fill();ctx.restore();
    ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(spr,pl.fr*32,DR[pl.dir]*32,32,32,pfx-23,pfy-42,46,46);ctx.restore();
  }

  nums=nums.filter(n=>{n.life-=dt;if(n.life<=0)return false;const a=n.life/n.maxLife;n.y+=n.vy;ctx.save();ctx.globalAlpha=a;ctx.fillStyle=n.col;ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.fillText(n.txt,n.x,n.y);ctx.restore();return true;});

  updateHUD();chkZone();
  requestAnimationFrame(loop);
}

// ── SAVE / LOAD ───────────────────────────────────────────────
const SAVE_KEY='zekvar_save_v1';

function saveGame(){
  const data={
    px:Math.round(pl.x),py:Math.round(pl.y),
    hp:pl.hp,maxHp:pl.maxHp,
    atkDmg:pl.atkDmg,def:pl.def,energy:pl.energy,resist:pl.resist,
    savedAt:Date.now()
  };
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));
    spawnNum(pl.cx-camX,pl.cy-camY-30,'💾 Salvo!','#60ff80');
  }catch(e){showNotif('⚠️ Erro ao salvar','#ff4040');}
}

function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return false;
    const d=JSON.parse(raw);
    pl.x=d.px??pl.x;pl.y=d.py??pl.y;
    pl.hp=d.hp??pl.hp;pl.maxHp=d.maxHp??pl.maxHp;
    pl.atkDmg=d.atkDmg??pl.atkDmg;pl.def=d.def??pl.def;
    pl.energy=d.energy??pl.energy;pl.resist=d.resist??pl.resist;
    return true;
  }catch(e){return false;}
}

// Auto-save every 60 seconds
let autoSaveTimer=0;

function start(){
  const loaded_save=loadGame();
  if(!loaded_save){pl.x=13*TILE;pl.y=11*TILE;}
  camX=pl.x-sf.clientWidth/2;camY=pl.y-sf.clientHeight/2;
  updateHUD();updateQuestLog();
  for(let i=0;i<4;i++)setTimeout(spawnMonster,i*700);
  spawnDragon();
  const msg=loaded_save?'✦ Jogo carregado':'✦ Dimensão do Zekvar';
  setTimeout(()=>{lbEl.textContent=msg;lbEl.classList.add('show');setTimeout(()=>lbEl.classList.remove('show'),3000);},500);
  requestAnimationFrame(ts=>{lastT=ts;loop(ts);});
}

let loaded=0;
function tryStart(){if(++loaded===2)start();}
spr.onload=tryStart;anSpr.onload=tryStart;
if(spr.complete&&spr.naturalWidth>0)tryStart();
if(anSpr.complete&&anSpr.naturalWidth>0)tryStart();

// ── INPUT ─────────────────────────────────────────────────────
function dpbtn(id,dir){
  const b=document.getElementById(id);
  const on=e=>{e.preventDefault();resumeAC();keys[dir]=true;b.classList.add('pr');};
  const off=e=>{e.preventDefault();keys[dir]=false;b.classList.remove('pr');};
  b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off,{passive:false});b.addEventListener('touchcancel',off,{passive:false});
  b.addEventListener('mousedown',on);b.addEventListener('mouseup',off);b.addEventListener('mouseleave',off);
}
dpbtn('bu','up');dpbtn('bd','down');dpbtn('bl','left');dpbtn('br','right');

const m1=document.getElementById('m1btn');
const m1fn=e=>{e.preventDefault();resumeAC();m1.classList.add('pr');setTimeout(()=>m1.classList.remove('pr'),120);if(dlgOpen)advanceDlg();else{doM1();checkInteract();}};
m1.addEventListener('touchstart',m1fn,{passive:false});m1.addEventListener('mousedown',m1fn);

SKILLS.forEach((sk,i)=>{
  const btn=document.getElementById(`sk${i}`);if(!btn)return;
  const use=e=>{e.preventDefault();resumeAC();if(sk.curCd>0)return;if(sk.use()!==false)sk.curCd=sk.cd;updateHUD();};
  btn.addEventListener('touchstart',use,{passive:false});btn.addEventListener('mousedown',use);
});

window.addEventListener('keydown',e=>{
  resumeAC();
  if(e.key==='ArrowUp'||e.key==='w')keys.up=true;if(e.key==='ArrowDown'||e.key==='s')keys.down=true;
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
  if(e.key===' '||e.key==='z'){if(dlgOpen)advanceDlg();else{doM1();checkInteract();}}
  if(e.key==='1'&&!SKILLS[0].curCd){SKILLS[0].use();SKILLS[0].curCd=SKILLS[0].cd;}
  if(e.key==='2'&&!SKILLS[1].curCd){SKILLS[1].use();SKILLS[1].curCd=SKILLS[1].cd;}
  if(e.key==='3'&&!SKILLS[2].curCd){SKILLS[2].use();SKILLS[2].curCd=SKILLS[2].cd;}
  e.preventDefault();
},{passive:false});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowUp'||e.key==='w')keys.up=false;if(e.key==='ArrowDown'||e.key==='s')keys.down=false;
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
});
